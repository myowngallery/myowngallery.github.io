<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vu5a | Design Works</title>
    <!-- Premium Apple-style typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --apple-black: #1d1d1f;
            --apple-gray: #f5f5f7;
            --apple-text-muted: #86868b;
            --navbar-height: 48px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #ffffff;
            color: var(--apple-black);
            overflow-x: hidden;
        }

        /* 1. Apple-Spec Global Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--navbar-height);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .nav-logo {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: -0.2px;
            color: var(--apple-black);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            font-size: 12px;
            font-weight: 400;
            color: var(--apple-black);
            opacity: 0.8;
            text-decoration: none;
            transition: opacity 0.2s ease;
            letter-spacing: 0.1px;
        }

        .nav-links a:hover {
            opacity: 1;
            color: #0071e3; /* Subtle Apple Blue accent on hover */
        }

        /* 2. Seamless Hero Presentation */
        .hero-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: var(--navbar-height);
        }

        .text-wrapper {
            padding: 80px 40px 40px 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1.08349;
            color: var(--apple-black);
        }

        .scroll-indicator {
            font-size: 12px;
            font-weight: 400;
            color: var(--apple-text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 3. High-End Image Presentation Container */
        .image-wrapper {
            flex-grow: 1;
            width: 100%;
            padding: 0 40px 40px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .showcase-frame {
            width: 100%;
            height: 65vh;
            border-radius: 28px; /* Smooth rounded device-like corners */
            overflow: hidden;
            background-color: var(--apple-gray);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .showcase-frame:hover {
            transform: scale(1.01); /* Soft fluid reaction on hover */
        }

        .showcase-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Keeps image beautifully scaled without stretching */
            object-position: center;
        }

        /* Responsive scaling for mobile screens */
        @media (max-width: 768px) {
            nav { padding: 0 20px; }
            .nav-links { gap: 20px; }
            .text-wrapper { 
                flex-direction: column; 
                align-items: flex-start; 
                gap: 16px;
                padding: 40px 20px 20px 20px;
            }
            h1 { font-size: 38px; }
            .image-wrapper { padding: 0 20px 20px 20px; }
            .showcase-frame { height: 45vh; border-radius: 18px; }
            .scroll-indicator { display: none; }
        }
    </style>
</head>
<body>

    <!-- Apple-Spec Clean Navbar -->
    <nav>
        <a href="#" class="nav-logo">@vu5a</a>
        <ul class="nav-links">
            <li><a href="#">Works</a></li>
            <li><a href="#">About</a></li>
            <li><a href="https://discord.gg/2gxHQVQyQC" target="_blank">Discord</a></li>
        </ul>
    </nav>

    <!-- Restructured Hero Layout -->
    <div class="hero-container">
        <div class="text-wrapper">
            <h1>Design Works</h1>
            <div class="scroll-indicator">
                Scroll down 
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
            </div>
        </div>

        <!-- The Showcase Viewport -->
        <div class="image-wrapper">
            <div class="showcase-frame">
                <!-- Replace 'mockup.jpg' with your live image URL once uploaded to your repo -->
                <img src="mockup.jpg" alt="Featured Livery Design">
            </div>
        </div>
    </div>

</body>
</html>
