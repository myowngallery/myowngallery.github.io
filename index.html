<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@vu5a | Premium Design Works</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --apple-black: #1d1d1f;
            --apple-text-muted: #86868b;
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            color: var(--apple-black);
            overflow-x: hidden;
        }

        /* Clean Premium Apple Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 52px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .nav-logo {
            font-weight: 700;
            font-size: 15px;
            color: var(--apple-black);
            text-decoration: none;
            letter-spacing: -0.2px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
            align-items: center;
        }

        .nav-links li {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 400;
            color: var(--apple-black);
        }

        /* Styled Premium Dot Separators */
        .nav-links li::before {
            content: "•";
            color: var(--apple-black);
            font-size: 10px;
            opacity: 0.5;
        }
        .nav-links li:first-child::before { display: none; }

        .nav-links a {
            color: var(--apple-black);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .nav-links a:hover { opacity: 1; }

        /* SECTION 1: Dynamic Zoom Landing Container */
        .zoom-scroll-zone {
            height: 160vh; /* Extra height creates the scroll room for zooming */
            background-color: #000;
            position: relative;
        }

        .sticky-wrapper {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .zoom-frame {
            width: 80vw;
            height: 70vh;
            border-radius: 24px;
            overflow: hidden;
            transition: transform 0.1s ease-out; /* Keeps animation buttery smooth */
            will-change: transform;
        }

        .zoom-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* SECTIONS 2 & 3: Apple Light Mode Product Templates */
        .product-section {
            position: relative;
            background: linear-gradient(180deg, #eaf4fa 0%, #ffffff 300px, #ffffff 100%);
            padding-top: 100px;
            padding-bottom: 120px;
            text-align: center;
            z-index: 2;
            box-shadow: 0 -20px 40px rgba(0,0,0,0.05);
        }

        .product-section.banners-zone {
            background: linear-gradient(180deg, #f2f2f7 0%, #ffffff 300px, #ffffff 100%);
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .product-section h2 {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -1.5px;
            margin-bottom: 20px;
            color: var(--apple-black);
        }

        /* Apple Precision Pill Button */
        .explore-btn {
            display: inline-block;
            background-color: var(--apple-blue);
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            transition: background-color 0.2s;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2);
        }
        .explore-btn:hover {
            background-color: var(--apple-blue-hover);
        }

        /* Showcases Grids using your layout file system */
        .grid-container {
            max-width: 1200px;
            margin: 80px auto 0 auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }

        .display-card {
            background: #f5f5f7;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .display-card:hover {
            transform: scale(1.02);
        }

        .display-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 768px) {
            nav { padding: 0 20px; }
            .nav-links { gap: 12px; }
            .product-section h2 { font-size: 38px; }
            .grid-container { grid-template-columns: 1fr; padding: 0 20px; }
            .zoom-frame { width: 95vw; height: 50vh; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="nav-logo">@vu5a</a>
        <ul class="nav-links">
            <li><a href="#liveries">Works</a></li>
            <li><a href="#">About</a></li>
            <li><a href="https://discord.gg/2gxHQVQyQC" target="_blank">Discord</a></li>
        </ul>
    </nav>

    <div class="zoom-scroll-zone">
        <div class="sticky-wrapper">
            <div class="zoom-frame" id="heroFrame">
                <img src="assets/images/showroom_01.png" alt="Featured Livery Showroom">
            </div>
        </div>
    </div>

    <section class="product-section" id="liveries">
        <h2>Liveries</h2>
        <a href="https://discord.gg/2gxHQVQyQC" target="_blank" class="explore-btn">Explore</a>

        <div class="grid-container">
            <div class="display-card"><img src="assets/images/showroom_02.png" alt="Livery Showcase 2"></div>
            <div class="display-card"><img src="assets/images/showroom_03.png" alt="Livery Showcase 3"></div>
            <div class="display-card"><img src="assets/images/showroom_04.png" alt="Livery Showcase 4"></div>
            <div class="display-card"><img src="assets/images/showroom_05.png" alt="Livery Showcase 5"></div>
        </div>
    </section>

    <section class="product-section banners-zone" id="banners">
        <h2>Banners</h2>
        <a href="https://discord.gg/2gxHQVQyQC" target="_blank" class="explore-btn">Explore</a>

        <div class="grid-container">
            <div class="display-card"><img src="assets/images/banner_01.png" alt="Banner Design 1"></div>
            <div class="display-card"><img src="assets/images/banner_02.png" alt="Banner Design 2"></div>
            <div class="display-card"><img src="assets/images/banner_03.png" alt="Banner Design 3"></div>
            <div class="display-card"><img src="assets/images/banner_04.png" alt="Banner Design 4"></div>
        </div>
    </section>

    <script>
        const heroFrame = document.getElementById('heroFrame');
        const scrollZone = document.querySelector('.zoom-scroll-zone');

        window.addEventListener('scroll', () => {
            const zoneRect = scrollZone.getBoundingClientRect();
            const zoneHeight = scrollZone.offsetHeight - window.innerHeight;
            
            // Calculate exact distance scrolled through the zoom zone (0 to 1)
            let progress = -zoneRect.top / zoneHeight;
            progress = Math.max(0, Math.min(1, progress));

            // Smoothly scale car from normal size up to filling/almost filling screen (1.25x)
            const targetScale = 1 + (progress * 0.25);
            
            // Apply scale hardware transformation natively
            heroFrame.style.transform = `scale(${targetScale})`;
        });
    </script>

</body>
</html>
