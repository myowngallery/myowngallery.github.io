<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@200;300;400&display=swap');
        
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .font-sans { font-family: 'Inter', sans-serif; }

        /* Smooth scroll revealing */
        html { scroll-behavior: smooth; }
        
        /* Custom fine scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb:hover { background: #333; }
    </style>
</head>
<body class="bg-[#050505] text-[#e5e5e5] font-sans antialiased selection:bg-neutral-900 selection:text-white">

    <!-- Minimalist Header -->
    <header class="fixed top-0 left-0 w-full z-50 mix-blend-difference px-8 py-6 flex justify-between items-center">
        <!-- Static Brand Name (No longer links to top) -->
        <span class="text-xs tracking-[0.3em] font-light uppercase text-white cursor-default select-none">My Gallery</span>
        
        <!-- Controls Group -->
        <div class="flex items-center gap-6">
            <!-- Discord Connect Button -->
            <a href="https://discord.gg/2gxHQVQyQC" target="_blank" rel="noopener noreferrer" class="text-[10px] tracking-widest text-neutral-400 hover:text-white transition flex items-center gap-3 group">
                <span class="w-1.5 h-1.5 rounded-full bg-neutral-600 group-hover:bg-[#5865F2] transition"></span>
                <span>CONNECT</span>
            </a>

            <!-- Audio Ambient Trigger -->
            <button id="audioBtn" class="text-[10px] tracking-widest text-neutral-400 hover:text-white transition flex items-center gap-3 group">
                <span class="w-1.5 h-1.5 rounded-full bg-neutral-600 group-hover:bg-white transition" id="audioDot"></span>
                <span id="audioStatusText">PLAY AUDIO</span>
            </button>
        </div>
    </header>

    <!-- Hidden Audio Element -->
    <audio id="bgAmbience" loop src="assets/audio/ambience.mp3"></audio>

    <!-- Hero Introduction Split -->
    <section class="min-h-screen flex flex-col justify-end px-8 pb-24 pt-32 max-w-7xl mx-auto border-b border-neutral-950">
        <div class="max-w-3xl space-y-4">
            <p class="text-xs tracking-[0.2em] text-neutral-500 uppercase">Automotive Architecture / Digital Liveries</p>
            <h2 class="text-4xl md:text-7xl font-serif font-light italic text-neutral-200 leading-tight">
                The following images are part of my portfolio of ERLC liveries.
            </h2>
        </div>
    </section>

    <!-- Editorial Gallery Main Grid -->
    <main class="max-w-7xl mx-auto px-8 py-24 space-y-40">

        <!-- Section 1: Main Showroom Exhibition (Asymmetrical Staggered Layout) -->
        <section class="space-y-24">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-neutral-900 pb-6">
                <span class="text-[10px] tracking-[0.3em] text-neutral-600 uppercase font-bold">01 / CURRENT EXHIBITS</span>
                <h3 class="text-xl font-serif font-light text-neutral-400 mt-2 md:mt-0">The Showroom Suite</h3>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-y-24 md:gap-x-12 items-center">
                <!-- Large Feature Image -->
                <div class="md:col-span-8 space-y-4">
                    <div class="overflow-hidden bg-neutral-950 aspect-[16/10] grayscale hover:grayscale-0 transition-all duration-700">
                        <img src="assets/images/showroom_01.png" alt="Showroom 01" class="w-full h-full object-cover">
                    </div>
                </div>
                
                <!-- Staggered Right Side Image -->
                <div class="md:col-span-4 md:mt-32 space-y-4">
                    <div class="overflow-hidden bg-neutral-950 aspect-[4/5] grayscale hover:grayscale-0 transition-all duration-700">
                        <img src="assets/images/showroom_02.png" alt="Showroom 02" class="w-full h-full object-cover">
                    </div>
                </div>

                <!-- Left Staggered Image -->
                <div class="md:col-span-5 space-y-4">
                    <div class="overflow-hidden bg-neutral-950 aspect-[4/5] grayscale hover:grayscale-0 transition-all duration-700">
                        <img src="assets/images/showroom_03.png" alt="Showroom 03" class="w-full h-full object-cover">
                    </div>
                </div>

                <!-- Double Wide Right Side -->
                <div class="md:col-span-7 space-y-4">
                    <div class="overflow-hidden bg-neutral-950 aspect-[16/10] grayscale hover:grayscale-0 transition-all duration-700">
                        <img src="assets/images/showroom_04.png" alt="Showroom 04" class="w-full h-full object-cover">
                    </div>
                </div>

                <!-- Centered Final Showroom Piece -->
                <div class="md:col-start-3 md:col-span-8 space-y-4 pt-12">
                    <div class="overflow-hidden bg-neutral-950 aspect-[16/9] grayscale hover:grayscale-0 transition-all duration-700">
                        <img src="assets/images/showroom_05.png" alt="Showroom 05" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>
        </section>

        <!-- Section 2: Archive Collection (Pure Minimalist Vertical Scroll) -->
        <section class="space-y-24 pt-12">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-neutral-900 pb-6">
                <span class="text-[10px] tracking-[0.3em] text-neutral-600 uppercase font-bold">02 / HISTORICAL EDITIONS</span>
                <h3 class="text-xl font-serif font-light text-neutral-400 mt-2 md:mt-0">The Livery Archive</h3>
            </div>

            <!-- Massive alternating display stack -->
            <div class="space-y-48">
                <div class="max-w-4xl mx-auto overflow-hidden bg-neutral-950 aspect-video group">
                    <img src="assets/images/archive_01.png" alt="Archive 01" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-700">
                </div>

                <div class="max-w-4xl mx-auto overflow-hidden bg-neutral-950 aspect-video group">
                    <img src="assets/images/archive_02.png" alt="Archive 02" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-700">
                </div>

                <div class="max-w-4xl mx-auto overflow-hidden bg-neutral-950 aspect-video group">
                    <img src="assets/images/archive_03.png" alt="Archive 03" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-700">
                </div>

                <div class="max-w-4xl mx-auto overflow-hidden bg-neutral-950 aspect-video group">
                    <img src="assets/images/archive_04.png" alt="Archive 04" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-700">
                </div>

                <div class="max-w-4xl mx-auto overflow-hidden bg-neutral-950 aspect-video group">
                    <img src="assets/images/archive_05.png" alt="Archive 05" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-700">
                </div>

                <div class="max-w-4xl mx-auto overflow-hidden bg-neutral-950 aspect-video group">
                    <img src="assets/images/archive_06.png" alt="Archive 06" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-700">
                </div>
            </div>
        </section>

    </main>

    <!-- Refined Footer -->
    <footer class="w-full py-16 px-8 border-t border-neutral-950 flex flex-col md:flex-row justify-between items-center text-[10px] tracking-[0.2em] text-neutral-600 uppercase gap-4">
        <div>&copy; 2026 MYOWNGALLERY.</div>
        <div class="font-serif italic lowercase text-xs text-neutral-500">curated with absolute discretion</div>
    </footer>

    <!-- Seamless Audio Player System -->
    <script>
        const audio = document.getElementById('bgAmbience');
        const audioBtn = document.getElementById('audioBtn');
        const dot = document.getElementById('audioDot');
        const text = document.getElementById('audioStatusText');

        audioBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    dot.classList.remove('bg-neutral-600');
                    dot.classList.add('bg-white', 'animate-pulse');
                    text.innerText = "MUTE AUDIO";
                }).catch(err => console.log("Audio block active:", err));
            } else {
                audio.pause();
                dot.classList.add('bg-neutral-600');
                dot.classList.remove('bg-white', 'animate-pulse');
                text.innerText = "PLAY AUDIO";
            }
        });

        // Trigger safe background audio loop initialization on primitive global touch
        document.body.addEventListener('click', () => {
            if (audio.paused && text.innerText === "PLAY AUDIO" && !audio.className.includes('ready')) {
                audio.play().then(() => {
                    dot.classList.remove('bg-neutral-600');
                    dot.classList.add('bg-white', 'animate-pulse');
                    text.innerText = "MUTE AUDIO";
                    audio.classList.add('ready');
                }).catch(() => {});
            }
        }, { once: true });
    </script>
</body>
</html>
