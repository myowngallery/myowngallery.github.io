<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@vu5a | Design Works</title>
    
    <!-- Core External Dependencies for Advanced Gallery Setup -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Cormorant Garamond', 'serif'],
                    },
                    colors: {
                        showroom: 'var(--color-showroom)',
                        ink: 'var(--color-ink)',
                        studio: 'var(--color-studio)',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght=0,300;0,400;1,300&family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --apple-black: #1d1d1f;
            --apple-gray: #f5f5f7;
            --apple-text-muted: #86868b;
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --navbar-height: 48px;
            
            /* Gallery Panel Color Definitions */
            --color-showroom: #ffffff;
            --color-ink: #1c1b18;
            --color-studio: #f5f5f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #ffffff;
            color: var(--apple-black);
            overflow-x: hidden;
        }

        @media (min-width: 768px) {
            .use-custom-cursor, .use-custom-cursor a, .use-custom-cursor button {
                cursor: none !important;
            }
        }

        /* 1. Apple Global Navigation Style */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--navbar-height);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 40;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .nav-logo {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: -0.2px;
            color: var(--apple-black);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
            align-items: center;
        }

        .nav-links li {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 13px;
            font-weight: 400;
        }

        .nav-links li::before {
            content: "•";
            color: var(--apple-black);
            font-size: 12px;
            opacity: 0.4;
        }

        .nav-links a {
            color: var(--apple-black);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }

        .nav-links a:hover {
            opacity: 1;
            color: var(--apple-blue);
        }

        /* 2. Interactive Scroll Sequence Zoom Track Layout */
        .hero-scroll-zone {
            height: 240vh; 
            position: relative;
            background-color: #ffffff;
        }

        .sticky-viewport {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        .text-wrapper {
            position: absolute;
            top: var(--navbar-height);
            left: 50%;
            transform: translateX(-50%);
            padding: 80px 40px 40px 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
            will-change: opacity, transform;
        }

        h1 {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1.08349;
            color: var(--apple-black);
        }

        .image-wrapper {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 80px);
            max-width: 1400px;
            height: 65vh;
            z-index: 5;
            will-change: width, height, bottom, max-width;
        }

        .showcase-frame {
            width: 100%;
            height: 100%;
            border-radius: 28px;
            overflow: hidden;
            background-color: var(--apple-gray);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        }

        .showcase-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* 3. Product Layout Showcase Grids */
        .product-section {
            position: relative;
            background: linear-gradient(180deg, #eaf4fa 0%, #ffffff 400px, #ffffff 100%);
            padding: 120px 0;
            text-align: center;
            z-index: 20;
        }

        .product-section.banners-zone {
            background: linear-gradient(180deg, #f2f2f7 0%, #ffffff 400px, #ffffff 100%);
            border-top: 1px solid rgba(0,0,0,0.03);
        }

        .product-section h2 {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -1.5px;
            margin-bottom: 20px;
            color: var(--apple-black);
        }

        .explore-btn {
            display: inline-block;
            background-color: var(--apple-blue);
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 24px;
            border-radius: 20px;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.2s;
            border: none;
            cursor: pointer;
        }
        .explore-btn:hover {
            background-color: var(--apple-blue-hover);
            transform: scale(1.02);
        }

        .grid-container {
            max-width: 1200px;
            margin: 60px auto 0 auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 32px;
        }

        /* FIX 2: Fixed card image truncation from example a1sx.jpg */
        .display-card {
            background: #f5f5f7;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .display-card img {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: contain; /* Prevents text from being cropped out on the sides */
            display: block;
        }

        /* Gallery Carousel Custom Styles overrides */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .showcase-card {
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* FIX 1: Shorter scrolling range adjustments optimized for mobile viewports */
        @media (max-width: 768px) {
            .hero-scroll-zone {
                height: 125vh; /* Dramatically compressed track allows lightning fast mobile zooming */
            }
            nav { padding: 0 20px; }
            .nav-links { gap: 12px; }
            .nav-links li { gap: 12px; }
            .text-wrapper { padding: 40px 20px; }
            h1 { font-size: 36px; }
            .image-wrapper { width: calc(100% - 40px); bottom: 20px; height: 55vh; }
            .product-section h2 { font-size: 38px; }
            .grid-container { grid-template-columns: 1fr; padding: 0 20px; }
        }
    </style>
</head>
<body class="use-custom-cursor">

    <!-- Fluid Trailing Interactive Custom Cursor Overlay Element -->
    <div id="custom-cursor" class="hidden md:flex fixed top-0 left-0 w-3 h-3 bg-[#1c1b18] rounded-full pointer-events-none z-50 items-center justify-start text-[9px] tracking-widest text-[#1c1b18] uppercase font-light opacity-0 transition-[width,height,background-color] duration-500 ease-[cubic-bezier(0.16,1,0.3,1)]">
        <span id="cursor-text" class="opacity-0 transition-opacity duration-300 pointer-events-none"></span>
    </div>

    <!-- Lightbox Cinematic Image Viewer Overlay Module -->
    <div id="lightbox" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500 backdrop-blur-md">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white/70 hover:text-white text-2xl z-50 p-4">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="w-full h-full p-4 flex items-center justify-center" onclick="closeLightbox()">
            <img id="lightbox-img" src="" alt="Enlarged Portfolio View" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl transition-transform duration-500 scale-95" onclick="event.stopPropagation()">
        </div>
    </div>

    <!-- Ambient Audio Component Setup -->
    <div class="fixed bottom-6 right-6 z-40 bg-white/80 backdrop-blur-md border border-stone-300/60 px-4 py-2.5 rounded-full flex items-center gap-3 shadow-sm hover:border-stone-400 transition-all">
        <span class="text-[10px] tracking-widest text-stone-500 uppercase font-light">Ambience</span>
        <button id="audio-toggle" class="w-6 h-6 flex items-center justify-center text-xs text-stone-700 hover:text-black focus:outline-none transition-colors">
            <i id="audio-icon" class="fa-solid fa-play"></i>
        </button>
        <audio id="bg-audio" loop src="assets/audio/ambience.mp3"></audio>
    </div>

    <!-- Global Navigation -->
    <nav>
        <a href="#" class="nav-logo">@vu5a</a>
        <ul class="nav-links">
            <li><a href="#liveries">Works</a></li>
            <li><a href="https://discord.gg/2gxHQVQyQC" target="_blank">Discord</a></li>
        </ul>
    </nav>

    <!-- Master Header Zoom Zone Layout Block -->
    <div class="hero-scroll-zone">
        <div class="sticky-viewport">
            <div class="text-wrapper" id="heroText">
                <h1>Design Works</h1>
                <div class="text-xs text-stone-400 flex items-center gap-1.5 hidden md:flex">
                    Scroll Down 
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
                </div>
            </div>
            <div class="image-wrapper" id="heroImageWrapper">
                <div class="showcase-frame" id="heroFrame">
                    <img src="assets/images/showroom_01.png" id="heroImg" alt="Featured Livery Design">
                </div>
            </div>
        </div>
    </div>

    <!-- Liveries Grid Showcase Section Block -->
    <section class="product-section" id="liveries">
        <h2>Liveries</h2>
        <!-- ADDITION 3: Opens the Interactive Drawer Stack Panel Gallery Instead of Linking to Discord -->
        <button onclick="openShowcase('liveries')" class="explore-btn">Explore Gallery</button>

        <div class="grid-container">
            <div class="display-card"><img src="assets/images/showroom_02.png" alt="Livery Design 2"></div>
            <div class="display-card"><img src="assets/images/showroom_03.png" alt="Livery Design 3"></div>
            <div class="display-card"><img src="assets/images/showroom_04.png" alt="Livery Design 4"></div>
        </div>
    </section>

    <!-- Banners Grid Showcase Section Block -->
    <section class="product-section banners-zone" id="banners">
        <h2>Banners</h2>
        <!-- ADDITION 3: Opens the Interactive Drawer Stack Panel Gallery Instead of Linking to Discord -->
        <button onclick="openShowcase('banners')" class="explore-btn">Explore Gallery</button>

        <div class="grid-container">
            <div class="display-card"><img src="assets/images/banner_01.png" alt="Banner Design 1"></div>
            <div class="display-card"><img src="assets/images/banner_02.png" alt="Banner Design 2"></div>
            <div class="display-card"><img src="assets/images/banner_03.png" alt="Banner Design 3"></div>
        </div>
    </section>

    <!-- Advanced Slide-Out Stack Deck Portfolio Component Container Overlay -->
    <div id="showcase-panel" class="fixed top-0 right-0 w-full h-full bg-[#ebeae4] z-50 transform translate-x-full transition-transform duration-[1000ms] cubic-bezier(0.16, 1, 0.3, 1) flex flex-col shadow-2xl border-l border-stone-200">
        <header class="p-6 md:px-12 md:py-8 flex justify-between items-center bg-[#ebeae4]/90 backdrop-blur-md border-b border-stone-200/60 z-40">
            <div>
                <button onclick="closeShowcase()" class="text-[11px] tracking-[0.2em] uppercase text-stone-500 hover:text-black transition-colors mb-1"><i class="fa-solid fa-arrow-left mr-2"></i> Close Index</button>
                <p id="greeting-text" class="text-xs text-stone-400 italic font-serif mt-1"></p>
            </div>
            <span class="font-serif italic text-lg tracking-wide">@vu5a</span>
        </header>

        <div id="experience-viewport" class="flex-1 relative overflow-hidden flex items-center justify-center">
            <div id="stack-carousel" class="absolute inset-0 w-full h-full flex flex-col items-center justify-center transition-all duration-700 pointer-events-none"></div>

            <!-- Grid Folder Archive Block (Step 6) -->
            <div id="folder-view" class="absolute inset-x-6 bottom-6 top-6 md:inset-12 bg-white border border-stone-300/80 shadow-2xl rounded-lg transform translate-y-full opacity-0 transition-all duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] z-20 flex flex-col p-6 overflow-hidden">
                <div class="flex justify-between items-center border-b border-stone-200 pb-4 mb-6">
                    <div class="flex items-center gap-3">
                        <i class="fa-regular fa-folder-open text-stone-500"></i>
                        <h4 class="font-serif text-xl italic text-black">Extended Index Archive</h4>
                    </div>
                    <span class="text-[9px] tracking-widest text-stone-400 uppercase">10 Collected Items</span>
                </div>
                <div id="folder-grid" class="grid grid-cols-2 md:grid-cols-5 gap-4 flex-1 overflow-y-auto no-scrollbar pb-4"></div>
            </div>

            <!-- Controller Arrow Buttons -->
            <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-30 flex flex-col items-center gap-1">
                <button id="nav-arrow" onclick="advanceStack()" class="w-10 h-10 bg-white/80 backdrop-blur-sm border border-stone-300 rounded-full flex items-center justify-center text-stone-600 shadow-sm hover:border-stone-500 hover:text-black transition-all">
                    <i id="arrow-icon" class="fa-solid fa-arrow-up text-xs"></i>
                </button>
                <span id="stack-counter" class="text-[9px] tracking-widest text-stone-400 uppercase mt-1">1 / 6</span>
            </div>
        </div>
    </div>

    <!-- Core Interactive Operations Engine Script -->
    <script>
        /* 1. Landing Screen Hero Scroll Zoom Logic */
        const scrollZone = document.querySelector('.hero-scroll-zone');
        const heroText = document.getElementById('heroText');
        const imageWrapper = document.getElementById('heroImageWrapper');
        const heroFrame = document.getElementById('heroFrame');
        const heroImg = document.getElementById('heroImg');

        window.addEventListener('scroll', () => {
            const zoneRect = scrollZone.getBoundingClientRect();
            const totalZoomScroll = scrollZone.offsetHeight - window.innerHeight;
            
            let progress = -zoneRect.top / totalZoomScroll;
            progress = Math.max(0, Math.min(1, progress));

            heroText.style.opacity = 1 - (progress * 2.5); 
            heroText.style.transform = `translate(-50%, ${-progress * 40}px)`;

            if (window.innerWidth > 768) {
                imageWrapper.style.bottom = `${(1 - progress) * 40}px`;
                imageWrapper.style.width = `calc(100% - ${(1 - progress) * 80}px)`;
                imageWrapper.style.maxWidth = progress === 1 ? '100vw' : `${1400 + (window.innerWidth - 1400) * progress}px`;
                imageWrapper.style.height = `${65 + (progress * 35)}vh`;
                heroFrame.style.borderRadius = `${(1 - progress) * 28}px`;
            } else {
                // Shortened mobile tracks run compression interpolations seamlessly here
                imageWrapper.style.bottom = `${(1 - progress) * 20}px`;
                imageWrapper.style.width = `calc(100% - ${(1 - progress) * 40}px)`;
                imageWrapper.style.height = `${55 + (progress * 45)}vh`;
                heroFrame.style.borderRadius = `${(1 - progress) * 18}px`;
            }
            heroImg.style.transform = `scale(${1 + (progress * 0.03)})`;
        });

        /* 2. Portfolio Multi-Stack Drawer Core Logic Engine */
        const dataSet = {
            liveries: {
                greeting: "The following images are part of my portfolio of ERLC liveries.",
                showcase: [
                    "assets/images/showroom_01.png", "assets/images/showroom_02.png",
                    "assets/images/showroom_03.png", "assets/images/showroom_04.png",
                    "assets/images/showroom_05.png"
                ],
                folder: [
                    "assets/images/showroom_01.png", "assets/images/showroom_02.png", "assets/images/showroom_03.png", "assets/images/showroom_04.png", "assets/images/showroom_05.png",
                    "assets/images/archive_01.png", "assets/images/archive_02.png", "assets/images/archive_03.png", "assets/images/archive_04.png", "assets/images/archive_06.png"
                ]
            },
            banners: {
                greeting: "The following images are part of my portfolio of Discord banners.",
                showcase: [
                    "assets/images/banner_01.png", "assets/images/banner_02.png",
                    "assets/images/banner_03.png", "assets/images/banner_04.png",
                    "assets/images/banner_05.png"
                ],
                folder: [
                    "assets/images/banner_01.png", "assets/images/banner_02.png", "assets/images/banner_03.png", "assets/images/banner_04.png", "assets/images/banner_05.png",
                    "assets/images/banner_archive_01.png", "assets/images/banner_archive_02.png", "assets/images/banner_archive_03.png", "assets/images/banner_archive_04.png", "assets/images/banner_archive_05.png"
                ]
            }
        };

        let currentTab = 'liveries';
        let currentIndex = 0; 
        const totalSteps = 6;
        let isTransitioning = false;

        const audio = document.getElementById('bg-audio');
        const audioToggle = document.getElementById('audio-toggle');
        const audioIcon = document.getElementById('audio-icon');

        function openShowcase(tab) {
            currentTab = tab;
            currentIndex = 0;
            document.getElementById('greeting-text').innerText = dataSet[tab].greeting;
            renderShowcaseContent();

            const panel = document.getElementById('showcase-panel');
            panel.classList.remove('translate-x-full');
            updateStackLayout();

            if (audio.paused) {
                audio.play().catch(() => console.log("Audio activation request caught."));
                audioIcon.className = 'fa-solid fa-pause';
            }
        }

        function closeShowcase() {
            document.getElementById('showcase-panel').classList.add('translate-x-full');
        }

        function renderShowcaseContent() {
            const carousel = document.getElementById('stack-carousel');
            const grid = document.getElementById('folder-grid');
            
            carousel.innerHTML = '';
            grid.innerHTML = '';

            const imgFitClass = currentTab === 'banners' ? 'object-contain bg-stone-900/5' : 'object-cover';

            dataSet[currentTab].showcase.forEach((imgSrc, i) => {
                carousel.innerHTML += `
                    <div id="card-${i}" onclick="openLightbox('${imgSrc}')" class="showcase-card viewable-target absolute w-[85%] md:w-[55%] h-[45vh] md:h-[60vh] bg-white border border-stone-200 p-3 shadow-xl flex items-center justify-center transform transition-all duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] rounded-3xl pointer-events-auto">
                        <img src="${imgSrc}" alt="Showcase ${i+1}" class="w-full h-full ${imgFitClass} rounded-2xl pointer-events-none">
                    </div>
                `;
            });

            dataSet[currentTab].folder.forEach((imgSrc, i) => {
                grid.innerHTML += `
                    <div onclick="openLightbox('${imgSrc}')" class="group viewable-target relative overflow-hidden bg-stone-100 border border-stone-200 aspect-[4/3] shadow-sm transition-all duration-500 hover:scale-[1.03] hover:shadow-xl rounded-xl">
                        <img src="${imgSrc}" alt="Archive ${i+1}" class="w-full h-full ${imgFitClass} filter grayscale group-hover:grayscale-0 transition-all duration-700 ease-out">
                    </div>
                `;
            });
            bindCursorEvents();
        }

        function updateStackLayout() {
            document.getElementById('stack-counter').innerText = `${currentIndex + 1} / ${totalSteps}`;
            const arrowIcon = document.getElementById('arrow-icon');
            const folderView = document.getElementById('folder-view');

            arrowIcon.className = currentIndex === totalSteps - 1 ? 'fa-solid fa-arrow-down text-xs' : 'fa-solid fa-arrow-up text-xs';
            
            if (currentIndex === 5) {
                folderView.classList.remove('translate-y-full', 'opacity-0');
            } else {
                folderView.classList.add('translate-y-full', 'opacity-0');
            }

            for (let i = 0; i < 5; i++) {
                const card = document.getElementById(`card-${i}`);
                if (!card) continue;

                let offset = i - currentIndex;

                if (offset === 0) {
                    card.style.transform = `translateY(0px) scale(1)`;
                    card.style.opacity = "1";
                    card.style.zIndex = "10";
                    card.style.pointerEvents = "auto";
                } else if (offset === 1) {
                    card.style.transform = `translateY(78%) scale(0.92)`;
                    card.style.opacity = "0.3";
                    card.style.zIndex = "5";
                    card.style.pointerEvents = "none";
                } else if (offset === -1) {
                    card.style.transform = `translateY(-78%) scale(0.92)`;
                    card.style.opacity = "0.3";
                    card.style.zIndex = "5";
                    card.style.pointerEvents = "none";
                } else if (offset < -1) {
                    card.style.transform = `translateY(-150%) scale(0.8)`;
                    card.style.opacity = "0";
                    card.style.zIndex = "1";
                    card.style.pointerEvents = "none";
                } else {
                    card.style.transform = `translateY(150%) scale(0.8)`;
                    card.style.opacity = "0";
                    card.style.zIndex = "1";
                    card.style.pointerEvents = "none";
                }
            }
        }

        function advanceStack() {
            currentIndex = currentIndex >= totalSteps - 1 ? 0 : currentIndex + 1;
            updateStackLayout();
        }

        function retreatStack() {
            if (currentIndex > 0) {
                currentIndex--;
                updateStackLayout();
            }
        }

        /* 3. Event Control Interfaces (Wheel & Swipe Tracks) */
        const panel = document.getElementById('showcase-panel');
        
        panel.addEventListener('wheel', (e) => {
            if (isTransitioning) return;
            if (currentIndex === 5) {
                const grid = document.getElementById('folder-grid');
                if (e.deltaY < 0 && grid.scrollTop === 0) {
                    currentIndex--;
                    updateStackLayout();
                    debounceScroll();
                }
                return;
            }
            if (e.deltaY > 20) { advanceStack(); debounceScroll(); }
            else if (e.deltaY < -20) { retreatStack(); debounceScroll(); }
        });

        let touchStartY = 0;
        panel.addEventListener('touchstart', (e) => { touchStartY = e.changedTouches[0].screenY; }, { passive: true });
        panel.addEventListener('touchend', (e) => {
            if (isTransitioning) return;
            const deltaY = touchStartY - e.changedTouches[0].screenY;

            if (currentIndex === 5) {
                const grid = document.getElementById('folder-grid');
                if (deltaY < -40 && grid.scrollTop === 0) {
                    currentIndex--;
                    updateStackLayout();
                    debounceScroll();
                }
                return;
            }
            if (deltaY > 40) { advanceStack(); debounceScroll(); }
            else if (deltaY < -40) { retreatStack(); debounceScroll(); }
        }, { passive: true });

        function debounceScroll() {
            isTransitioning = true;
            setTimeout(() => { isTransitioning = false; }, 800);
        }

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = src;
            lightbox.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => lightboxImg.classList.remove('scale-95'), 10);
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('lightbox-img').classList.add('scale-95');
        }

        audioToggle.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().catch(() => console.log("Audio block bypass required."));
                audioIcon.className = 'fa-solid fa-pause';
            } else {
                audio.pause();
                audioIcon.className = 'fa-solid fa-play';
            }
        });

        /* 4. Desktop Fluid Trailing Cursor Script */
        const cursor = document.getElementById('custom-cursor');
        const cursorText = document.getElementById('cursor-text');
        let mouseX = 0, mouseY = 0, cursorX = 0, cursorY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            if (cursor.style.opacity === '0' || !cursor.style.opacity) cursor.style.opacity = '1';
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.25;
            cursorY += (mouseY - cursorY) * 0.25;
            cursor.style.transform = `translate3d(${cursorX - cursor.offsetWidth / 2}px, ${cursorY - cursor.offsetHeight / 2}px, 0)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        function bindCursorEvents() {
            document.querySelectorAll('button, a, .explore-btn').forEach(el => {
                el.addEventListener('mouseenter', () => cursor.classList.add('scale-150'));
                el.addEventListener('mouseleave', () => cursor.classList.remove('scale-150'));
            });

            document.querySelectorAll('.viewable-target').forEach(el => {
                el.addEventListener('mouseenter', () => {
                    cursor.classList.remove('w-3', 'h-3');
                    cursor.classList.add('w-5', 'h-5', 'bg-white/90');
                    cursorText.innerText = "view";
                    cursorText.className = "absolute left-7 text-[9px] tracking-widest text-black uppercase font-medium opacity-100 whitespace-nowrap";
                });
                el.addEventListener('mouseleave', () => {
                    cursor.classList.remove('w-5', 'h-5', 'bg-white/90');
                    cursor.classList.add('w-3', 'h-3');
                    cursorText.innerText = "";
                    cursorText.className = "opacity-0";
                });
            });
        }
        document.addEventListener("DOMContentLoaded", bindCursorEvents);
    </script>
</body>
</html>
