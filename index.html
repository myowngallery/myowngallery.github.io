<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@vu5a — Portfolio Showroom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Cormorant Garamond', 'serif'],
                    },
                    colors: {
                        showroom: 'var(--color-showroom)',
                        ink: 'var(--color-ink)',
                        studio: 'var(--color-studio)',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght=0,300;0,400;1,300&family=Inter:wght=200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --color-showroom: #f5f4f0;
            --color-ink: #1c1b18;
            --color-studio: #ebeae4;
        }
        .dark {
            --color-showroom: #141412;
            --color-ink: #e6e5e0;
            --color-studio: #1d1d1a;
        }

        body, #showcase-panel, .showcase-card, #folder-view {
            transition: background-color 0.5s ease, border-color 0.5s ease, color 0.5s ease;
        }

        @media (min-width: 768px) {
            body, a, button, .group, .clickable, .viewable-target {
                cursor: none !important;
            }
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .showcase-card {
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.5s ease;
        }
    </style>
</head>
<body class="bg-showroom text-ink font-sans selection:bg-ink selection:text-showroom antialiased overflow-hidden w-screen h-screen">

    <div id="custom-cursor" class="hidden md:flex fixed top-0 left-0 w-3 h-3 bg-ink rounded-full pointer-events-none z-50 items-center justify-start text-[9px] tracking-widest text-ink uppercase font-light opacity-0 transition-[width,height,background-color] duration-500 ease-[cubic-bezier(0.16,1,0.3,1)]">
        <span id="cursor-text" class="opacity-0 transition-opacity duration-300 pointer-events-none"></span>
    </div>

    <div id="lightbox" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500 backdrop-blur-md">
        <button onclick="closeLightbox()" class="clickable absolute top-6 right-6 text-white/70 hover:text-white text-2xl z-50 p-4">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="w-full h-full p-4 flex items-center justify-center" onclick="closeLightbox()">
            <img id="lightbox-img" src="" alt="Enlarged Portfolio View" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl transition-transform duration-500 scale-95" onclick="event.stopPropagation()">
        </div>
    </div>

    <div class="fixed bottom-6 right-6 z-50 bg-showroom/80 dark:bg-showroom/60 backdrop-blur-md border border-stone-300/60 dark:border-stone-800 px-4 py-2.5 rounded-full flex items-center gap-3 shadow-sm hover:border-stone-400 dark:hover:border-stone-600 transition-all">
        <span class="text-[10px] tracking-widest text-stone-500 dark:text-stone-400 uppercase font-light">Ambience</span>
        <button id="audio-toggle" class="clickable w-6 h-6 flex items-center justify-center text-xs text-ink/70 hover:text-ink focus:outline-none transition-colors">
            <i id="audio-icon" class="fa-solid fa-play"></i>
        </button>
        <audio id="bg-audio" loop src="assets/audio/ambience.mp3"></audio>
    </div>

    <main class="w-full h-full flex flex-col justify-between p-6 md:p-12 relative z-10">
        <header class="w-full flex justify-between items-center">
            <div class="flex items-center gap-4">
                <span class="font-serif italic text-xl tracking-wide">@vu5a</span>
                <button onclick="toggleTheme()" class="clickable w-8 h-8 rounded-full border border-stone-300/60 dark:border-stone-800 flex items-center justify-center text-xs text-stone-500 dark:text-stone-400 hover:text-ink hover:border-stone-400 transition-all" title="Toggle Light/Dark">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
            <span class="text-[10px] tracking-[0.3em] uppercase text-stone-400 font-light">Portfolio 2026</span>
        </header>

        <section class="max-w-4xl mx-auto text-center my-auto flex flex-col items-center">
            <h1 class="font-serif text-6xl md:text-8xl font-light text-ink tracking-tight mb-2">Portfolio</h1>
            <p class="font-serif text-xl italic text-stone-500 mb-6">by @vu5a</p>
            
            <p class="font-sans font-light text-stone-600 dark:text-stone-400 text-sm md:text-base max-w-md tracking-wider leading-relaxed mb-8 uppercase text-xs">
                Livery, Banner, and Embed Designer
            </p>

            <a href="https://discord.gg/2gxHQVQyQC" target="_blank" class="clickable inline-flex items-center gap-3 border border-ink px-8 py-3.5 text-xs tracking-[0.2em] uppercase text-ink hover:bg-ink hover:text-showroom transition-all duration-500 rounded-full group">
                <i class="fa-brands fa-discord transition-transform group-hover:scale-110"></i> Connect with me
            </a>

            <div class="flex gap-4 mt-16 border-t border-stone-200 dark:border-stone-800 pt-8 w-64 justify-center">
                <button onclick="openShowcase('liveries')" class="clickable text-[11px] tracking-[0.2em] uppercase text-stone-400 hover:text-ink transition-colors font-medium">Liveries</button>
                <span class="text-stone-300 dark:text-stone-700">/</span>
                <button onclick="openShowcase('banners')" class="clickable text-[11px] tracking-[0.2em] uppercase text-stone-400 hover:text-ink transition-colors font-medium">Banners</button>
            </div>
        </section>

        <footer class="w-full text-center text-[10px] tracking-widest text-stone-400 font-light">
            &copy; 2026 @vu5a. Designed for clean aesthetics.
        </footer>
    </main>

    <div id="showcase-panel" class="fixed top-0 right-0 w-full h-full bg-studio z-30 transform translate-x-full transition-transform duration-[1000ms] cubic-bezier(0.16, 1, 0.3, 1) flex flex-col shadow-2xl border-l border-stone-200 dark:border-stone-800">
        
        <header class="p-6 md:px-12 md:py-8 flex justify-between items-center bg-studio/90 backdrop-blur-md border-b border-stone-200/60 dark:border-stone-800/60 z-40">
            <div>
                <button onclick="closeShowcase()" class="clickable text-[11px] tracking-[0.2em] uppercase text-stone-500 hover:text-ink transition-colors mb-1"><i class="fa-solid fa-arrow-left mr-2"></i> Back</button>
                <p id="greeting-text" class="text-xs text-stone-400 italic font-serif mt-1"></p>
            </div>
            <span class="font-serif italic text-lg tracking-wide">@vu5a</span>
        </header>

        <div id="experience-viewport" class="flex-1 relative overflow-hidden flex items-center justify-center">
            
            <div id="stack-carousel" class="absolute inset-0 w-full h-full flex flex-col items-center justify-center transition-all duration-700 pointer-events-none">
                </div>

            <div id="folder-view" class="absolute inset-x-6 bottom-6 top-6 md:inset-12 bg-showroom border border-stone-300/80 dark:border-stone-800 shadow-2xl rounded-lg transform translate-y-full opacity-0 transition-all duration-1000 ease-[cubic-bezier(0.16,1,0.3,1)] z-20 flex flex-col p-6 overflow-hidden">
                <div class="flex justify-between items-center border-b border-stone-200 dark:border-stone-800 pb-4 mb-6">
                    <div class="flex items-center gap-3">
                        <i class="fa-regular fa-folder-open text-stone-500"></i>
                        <h4 class="font-serif text-xl italic text-ink">Extended Index Archive</h4>
                    </div>
                    <span class="text-[9px] tracking-widest text-stone-400 uppercase">10 Collected Items</span>
                </div>
                <div id="folder-grid" class="grid grid-cols-2 md:grid-cols-5 gap-4 flex-1 overflow-y-auto no-scrollbar pb-4">
                    </div>
            </div>

            <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-30 flex flex-col items-center gap-1">
                <button id="nav-arrow" onclick="advanceStack()" class="clickable w-10 h-10 bg-showroom/80 dark:bg-showroom/60 backdrop-blur-sm border border-stone-300 dark:border-stone-800 rounded-full flex items-center justify-center text-stone-600 dark:text-stone-400 shadow-sm hover:border-stone-500 dark:hover:border-stone-400 hover:text-ink transition-all">
                    <i id="arrow-icon" class="fa-solid fa-arrow-up text-xs"></i>
                </button>
                <span id="stack-counter" class="text-[9px] tracking-widest text-stone-400 uppercase mt-1">1 / 6</span>
            </div>

        </div>
    </div>

    <script>
        const dataSet = {
            liveries: {
                greeting: "The following images are part of my portfolio of ERLC liveries.",
                showcase: [
                    "assets/images/showroom_01.png",
                    "assets/images/showroom_02.png",
                    "assets/images/showroom_03.png",
                    "assets/images/showroom_04.png",
                    "assets/images/showroom_05.png"
                ],
                // Skipped archive_05 explicitly
                folder: [
                    "assets/images/showroom_01.png", "assets/images/showroom_02.png", "assets/images/showroom_03.png", "assets/images/showroom_04.png", "assets/images/showroom_05.png",
                    "assets/images/archive_01.png", "assets/images/archive_02.png", "assets/images/archive_03.png", "assets/images/archive_04.png", "assets/images/archive_06.png"
                ]
            },
            banners: {
                greeting: "The following images are part of my portfolio of Discord banners.",
                showcase: [
                    "assets/images/banner_01.png",
                    "assets/images/banner_02.png",
                    "assets/images/banner_03.png",
                    "assets/images/banner_04.png",
                    "assets/images/banner_05.png"
                ],
                folder: [
                    "assets/images/banner_01.png", "assets/images/banner_02.png", "assets/images/banner_03.png", "assets/images/banner_04.png", "assets/images/banner_05.png",
                    "assets/images/banner_archive_01.png", "assets/images/banner_archive_02.png", "assets/images/banner_archive_03.png", "assets/images/banner_archive_04.png", "assets/images/banner_archive_05.png"
                ]
            }
        };

        let currentTab = 'liveries';
        let currentIndex = 0; 
        const totalSteps = 6;
        let isTransitioning = false;

        const audio = document.getElementById('bg-audio');
        const audioToggle = document.getElementById('audio-toggle');
        const audioIcon = document.getElementById('audio-icon');

        function toggleTheme() {
            const root = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (root.classList.contains('dark')) {
                root.classList.remove('dark');
                icon.className = 'fa-solid fa-moon';
            } else {
                root.classList.add('dark');
                icon.className = 'fa-solid fa-sun';
            }
        }

        function openShowcase(tab) {
            currentTab = tab;
            currentIndex = 0;
            document.getElementById('greeting-text').innerText = dataSet[tab].greeting;
            renderShowcaseContent();

            const panel = document.getElementById('showcase-panel');
            panel.style.transition = "transform 0.8s cubic-bezier(0.16, 1, 0.3, 1)";
            panel.classList.remove('translate-x-full');
            updateStackLayout();

            if (audio.paused) {
                audio.play().catch(() => console.log("Audio play request caught."));
                audioIcon.className = 'fa-solid fa-pause';
            }
        }

        function closeShowcase() {
            const panel = document.getElementById('showcase-panel');
            panel.classList.add('translate-x-full');
        }

        function renderShowcaseContent() {
            const carousel = document.getElementById('stack-carousel');
            const grid = document.getElementById('folder-grid');
            
            carousel.innerHTML = '';
            grid.innerHTML = '';

            const imgFitClass = currentTab === 'banners' ? 'object-contain bg-stone-900/5' : 'object-cover';

            dataSet[currentTab].showcase.forEach((imgSrc, i) => {
                carousel.innerHTML += `
                    <div id="card-${i}" onclick="openLightbox('${imgSrc}')" class="showcase-card viewable-target absolute w-[80%] md:w-[55%] h-[50vh] md:h-[60vh] bg-showroom border border-stone-200 p-3 shadow-md flex items-center justify-center transform transition-all duration-700 ease-[cubic-bezier(0.16, 1, 0.3, 1)] rounded-3xl pointer-events-auto">
                        <img src="${imgSrc}" alt="Showcase ${i+1}" class="w-full h-full ${imgFitClass} shadow-inner rounded-2xl pointer-events-none">
                    </div>
                `;
            });

            dataSet[currentTab].folder.forEach((imgSrc, i) => {
                grid.innerHTML += `
                    <div onclick="openLightbox('${imgSrc}')" class="group viewable-target relative overflow-hidden bg-stone-100 dark:bg-stone-900 border border-stone-200 dark:border-stone-800 aspect-[4/3] shadow-sm transition-all duration-500 hover:scale-[1.03] hover:shadow-xl rounded-xl">
                        <img src="${imgSrc}" alt="Archive ${i+1}" class="w-full h-full ${imgFitClass} filter grayscale group-hover:grayscale-0 transition-all duration-700 ease-out">
                        <div class="absolute inset-0 bg-ink/10 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
                    </div>
                `;
            });
            bindCursorEvents();
        }

        function updateStackLayout() {
            const counter = document.getElementById('stack-counter');
            const folderView = document.getElementById('folder-view');
            const arrowIcon = document.getElementById('arrow-icon');

            counter.innerText = `${currentIndex + 1} / ${totalSteps}`;

            if (currentIndex === totalSteps - 1) {
                arrowIcon.className = 'fa-solid fa-arrow-down text-xs'; 
            } else {
                arrowIcon.className = 'fa-solid fa-arrow-up text-xs';
            }

            if (currentIndex === 5) {
                folderView.classList.remove('translate-y-full', 'opacity-0');
            } else {
                folderView.classList.add('translate-y-full', 'opacity-0');
            }

            for (let i = 0; i < 5; i++) {
                const card = document.getElementById(`card-${i}`);
                if (!card) continue;

                let offset = i - currentIndex;

                if (offset === 0) {
                    card.style.transform = `translateY(0px) scale(1)`;
                    card.style.opacity = "1";
                    card.style.zIndex = "10";
                    card.style.pointerEvents = "auto";
                } else if (offset === 1) {
                    card.style.transform = `translateY(78%) scale(0.92)`;
                    card.style.opacity = "0.4";
                    card.style.zIndex = "5";
                    card.style.pointerEvents = "none";
                } else if (offset === -1) {
                    card.style.transform = `translateY(-78%) scale(0.92)`;
                    card.style.opacity = "0.4";
                    card.style.zIndex = "5";
                    card.style.pointerEvents = "none";
                } else if (offset < -1) {
                    card.style.transform = `translateY(-150%) scale(0.8)`;
                    card.style.opacity = "0";
                    card.style.zIndex = "1";
                    card.style.pointerEvents = "none";
                } else {
                    card.style.transform = `translateY(150%) scale(0.8)`;
                    card.style.opacity = "0";
                    card.style.zIndex = "1";
                    card.style.pointerEvents = "none";
                }
            }
        }

        function advanceStack() {
            if (currentIndex >= totalSteps - 1) {
                currentIndex = 0; 
            } else {
                currentIndex++;
            }
            updateStackLayout();
        }

        function retreatStack() {
            if (currentIndex > 0) {
                currentIndex--;
                updateStackLayout();
            }
        }

        document.getElementById('showcase-panel').addEventListener('wheel', (e) => {
            if (isTransitioning) return;
            
            if (currentIndex === 5) {
                const grid = document.getElementById('folder-grid');
                if (e.deltaY < 0 && grid.scrollTop === 0) {
                    currentIndex--;
                    updateStackLayout();
                    debounceScroll();
                }
                return;
            }

            if (e.deltaY > 20) {
                advanceStack();
                debounceScroll();
            } else if (e.deltaY < -20) {
                networkRetreat();
                retreatStack();
                debounceScroll();
            }
        });

        let touchStartY = 0;
        let touchEndY = 0;
        const panel = document.getElementById('showcase-panel');

        panel.addEventListener('touchstart', (e) => {
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        panel.addEventListener('touchend', (e) => {
            if (isTransitioning) return;
            
            touchEndY = e.changedTouches[0].screenY;
            const deltaY = touchStartY - touchEndY;

            if (currentIndex === 5) {
                const grid = document.getElementById('folder-grid');
                if (deltaY < -40 && grid.scrollTop === 0) {
                    currentIndex--;
                    updateStackLayout();
                    debounceScroll();
                }
                return;
            }

            if (deltaY > 40) {
                advanceStack();
                debounceScroll();
            } else if (deltaY < -40) {
                retreatStack();
                debounceScroll();
            }
        }, { passive: true });

        function debounceScroll() {
            isTransitioning = true;
            setTimeout(() => { isTransitioning = false; }, 800);
        }

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = src;
            lightbox.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => lightboxImg.classList.remove('scale-95'), 10);
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.classList.add('scale-95');
            lightbox.classList.add('opacity-0', 'pointer-events-none');
        }

        audioToggle.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().catch(() => console.log("Audio block bypass required."));
                audioIcon.className = 'fa-solid fa-pause';
            } else {
                audio.pause();
                audioIcon.className = 'fa-solid fa-play';
            }
        });

        // Clean Minimalist Custom Cursor System
        const cursor = document.getElementById('custom-cursor');
        const cursorText = document.getElementById('cursor-text');
        let mouseX = 0, mouseY = 0, cursorX = 0, cursorY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            if (!cursor.style.opacity || cursor.style.opacity === '0') cursor.style.opacity = '1';
        });

        function animateCursor() {
            // FIXED: Raised interpolation speed to 0.35 from 0.15 for tighter tracking latency
            cursorX += (mouseX - cursorX) * 0.35;
            cursorY += (mouseY - cursorY) * 0.35;
            cursor.style.transform = `translate3d(${cursorX - cursor.offsetWidth / 2}px, ${cursorY - cursor.offsetHeight / 2}px, 0)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        function bindCursorEvents() {
            document.querySelectorAll('.clickable, button, a').forEach(el => {
                el.addEventListener('mouseenter', () => {
                    cursor.classList.remove('w-3', 'h-3');
                    cursor.classList.add('w-4', 'h-4');
                });
                el.addEventListener('mouseleave', () => {
                    cursor.classList.remove('w-4', 'h-4');
                    cursor.classList.add('w-3', 'h-3');
                });
            });

            document.querySelectorAll('.viewable-target').forEach(el => {
                el.addEventListener('mouseenter', () => {
                    cursor.classList.remove('w-3', 'h-3');
                    cursor.classList.add('w-4', 'h-4');
                    
                    cursorText.innerText = "— view";
                    cursorText.className = "absolute left-6 text-[10px] tracking-widest text-ink uppercase font-light opacity-100 transition-opacity duration-300 pointer-events-none whitespace-nowrap";
                });
                el.addEventListener('mouseleave', () => {
                    cursor.classList.remove('w-4', 'h-4');
                    cursor.classList.add('w-3', 'h-3');
                    
                    cursorText.innerText = "";
                    cursorText.className = "opacity-0 transition-opacity duration-300 pointer-events-none";
                });
            });
        }
        document.addEventListener("DOMContentLoaded", bindCursorEvents);
    </script>
</body>
</html>
